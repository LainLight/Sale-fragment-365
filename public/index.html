<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fragment Sale UI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>Fragment Sale UI</h1>
        <p class="description">
          Укажите данные для продажи NFT username через Fragment. Все значения можно настроить вручную.
        </p>
        <form id="sale-form" class="form">
          <div class="field">
            <label for="mnemonic">Seed-фраза (mnemonic)</label>
            <textarea id="mnemonic" name="mnemonic" rows="3" placeholder="введите сид-фразу" required></textarea>
          </div>

          <div class="field">
            <label for="nftAddress">Адрес NFT</label>
            <input id="nftAddress" name="nftAddress" type="text" placeholder="EQA..." required />
          </div>

          <div class="field grid">
            <div>
              <label for="priceTon">Цена, TON</label>
              <input id="priceTon" name="priceTon" type="number" min="0" step="0.000000001" value="500" required />
            </div>
            <div>
              <label for="transferValue">Комиссия к NFT, TON</label>
              <input id="transferValue" name="transferValue" type="number" min="0" step="0.000000001" value="0.1" />
            </div>
          </div>

          <div class="field grid">
            <div>
              <label for="duration">Длительность (сек.)</label>
              <input id="duration" name="duration" type="number" min="0" value="31536000" />
            </div>
            <div>
              <label for="minExtendTime">min_extend_time (сек.)</label>
              <input id="minExtendTime" name="minExtendTime" type="number" min="0" value="3600" />
            </div>
          </div>

          <div class="field grid">
            <div>
              <label for="minBidStep">min_bid_step</label>
              <input id="minBidStep" name="minBidStep" type="number" min="0" value="5" />
            </div>
            <div>
              <label for="queryId">query_id</label>
              <input id="queryId" name="queryId" type="number" min="0" value="13" />
            </div>
          </div>

          <div class="field">
            <label for="beneficiaryAddress">Beneficiary (опционально)</label>
            <input id="beneficiaryAddress" name="beneficiaryAddress" type="text" placeholder="адрес кошелька" />
          </div>

          <details class="advanced">
            <summary>Дополнительные настройки сети</summary>
            <div class="field">
              <label for="endpoint">Endpoint</label>
              <input id="endpoint" name="endpoint" type="text" value="https://toncenter.com/api/v2/jsonRPC" />
            </div>
            <div class="field">
              <label for="apiKey">TON API Key</label>
              <input id="apiKey" name="apiKey" type="text" placeholder="необязательно" />
            </div>
          </details>

          <button type="submit" class="submit">Выставить на продажу</button>
        </form>

        <output id="result" class="result" aria-live="polite"></output>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
